; HydroDesk Base – echte Firmware für das CYD (ESP32-2432S028R)
; Quellcode: ../wokwi/sketch.ino (derselbe Sketch wie in der Simulation, hier mit HYDRO_CYD=1 und HYDRO_BLE=1)
; Bauen/Hochladen: in VS Code diesen Ordner öffnen -> PlatformIO -> Upload
; Erfolgreich gebaut und auf das CYD geladen am 09.11.2026 (RAM 18 %, Flash 41,6 %).
[platformio]
src_dir = ../wokwi

[env:cyd]
; feste pioarduino-Version (Arduino-ESP32-Kern 3.1.3); "stable" verlangt eine neuere PlatformIO-Core-Version
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
  bogde/HX711
  adafruit/Adafruit NeoPixel
  bodmer/TFT_eSPI
  ; Registry-Version kennt begin(SPIClass&) noch nicht -> GitHub-Stand
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
  h2zero/NimBLE-Arduino@^2.5.1
build_flags =
  -DHYDRO_CYD=1
  -DHYDRO_BLE=1
  ; TFT_eSPI-Einstellungen für das CYD (statt User_Setup.h)
  -DUSER_SETUP_LOADED=1
  -DILI9341_2_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1
  -DLOAD_GLCD=1
  -DSPI_FREQUENCY=55000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
